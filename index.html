<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarePlus Polyclinic — Live Token & Wait-Time Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .pulse-dot {
      animation: pulse-ring 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <!-- Brand -->
      <a href="?" onclick="navigateToRoot(event)" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center font-bold text-lg shadow-sm group-hover:bg-teal-700 transition">
          +
        </div>
        <div>
          <span class="font-bold text-slate-900 text-base sm:text-lg tracking-tight">CarePlus</span>
          <span class="hidden sm:inline-block text-xs text-slate-400 ml-2 font-medium">Live Queue Tracker</span>
        </div>
      </a>

      <!-- Right Action Controls -->
      <div id="navRightControls" class="flex items-center gap-2"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div id="appRoot"></div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5">
      <span id="toastIcon" class="text-teal-400 font-bold">✓</span>
      <span id="toastMessage">Updated</span>
    </div>
  </div>

  <script>
    // =========================================================
    // 1. DEFAULT DATA & STORAGE INITIALIZATION
    // =========================================================
    const STORAGE_KEY = 'careplus_clinicqueue_state_v3';
    const SESSION_KEY = 'careplus_clinicqueue_session_v3';

    const DEFAULT_STATE = {
      admin: {
        username: 'admin',
        password: 'admin123'
      },
      doctors: [
        {
          id: 'sharma',
          name: 'Dr. A. K. Sharma',
          specialty: 'General Physician & Diabetologist',
          room: 'Room 101',
          username: 'sharma',
          password: 'clinic123',
          avgMins: 10,
          currentToken: 6,
          totalTokens: 18,
          status: 'open', // 'open' | 'break' | 'closed'
          breakDelayMins: 0,
          sessionStartedAt: Date.now() - (48 * 60000), // Demo: 5 patients seen -> live pace
          pausedAt: null,
          totalPausedMs: 0
        },
        {
          id: 'nair',
          name: 'Dr. Priya Nair',
          specialty: 'Pediatrician',
          room: 'Room 102',
          username: 'nair',
          password: 'clinic123',
          avgMins: 8,
          currentToken: 3,
          totalTokens: 14,
          status: 'open',
          breakDelayMins: 0,
          sessionStartedAt: Date.now() - (16 * 60000), // Demo: 2 patients seen -> standard pace
          pausedAt: null,
          totalPausedMs: 0
        },
        {
          id: 'mohanty',
          name: 'Dr. R. K. Mohanty',
          specialty: 'Orthopedic Surgeon',
          room: 'Room 204',
          username: 'mohanty',
          password: 'clinic123',
          avgMins: 12,
          currentToken: 4,
          totalTokens: 15,
          status: 'break',
          breakDelayMins: 15,
          sessionStartedAt: Date.now() - (45 * 60000),
          pausedAt: Date.now() - (5 * 60000),
          totalPausedMs: 0
        }
      ]
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          saveState(DEFAULT_STATE);
          return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }
        return JSON.parse(raw);
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getAuthSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function setAuthSession(session) {
      if (!session) {
        sessionStorage.removeItem(SESSION_KEY);
      } else {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      }
    }

    let appState = loadState();
    let currentView = 'auto'; // 'auto' | 'login' | 'dashboard'
    let lookupTokenNumber = '';
    let editingDoctorId = null;

    // =========================================================
    // 2. HYBRID DYNAMIC WAIT-TIME LOGIC
    // =========================================================
    const WARMUP_PATIENT_COUNT = 5;

    function getEffectiveAvgInfo(doctor) {
      const patientsSeen = Math.max(0, (doctor.currentToken || 0) - 1);

      // Phase 1: First 4-5 patients (< 5 completed) -> use configured baseline
      if (patientsSeen < WARMUP_PATIENT_COUNT || !doctor.sessionStartedAt) {
        return {
          effectiveMins: Number(doctor.avgMins) || 10,
          mode: 'standard',
          patientsSeen,
          activeElapsedMins: 0
        };
      }

      // Phase 2: After 5 patients -> total active session time / total patients seen
      const currentPauseMs = (doctor.status === 'break' && doctor.pausedAt)
        ? (Date.now() - doctor.pausedAt)
        : 0;
      const totalPaused = (doctor.totalPausedMs || 0) + currentPauseMs;
      const activeElapsedMs = Math.max(60000, Date.now() - doctor.sessionStartedAt - totalPaused);
      const activeElapsedMins = activeElapsedMs / 60000;

      const rawCalculated = activeElapsedMins / patientsSeen;
      const clamped = Math.max(2, Math.min(45, Math.round(rawCalculated * 10) / 10));

      return {
        effectiveMins: clamped,
        mode: 'live',
        patientsSeen,
        activeElapsedMins: Math.round(activeElapsedMins)
      };
    }

    function calculateWaitForToken(doctor, targetToken) {
      const current = doctor.currentToken || 0;
      if (targetToken < current) {
        return { state: 'passed', waitMins: 0, etaString: 'Already called' };
      }
      if (targetToken === current) {
        return { state: 'serving', waitMins: 0, etaString: 'Now in cabin' };
      }

      const { effectiveMins } = getEffectiveAvgInfo(doctor);
      const tokensAhead = targetToken - current;
      const breakBuffer = doctor.status === 'break' ? (Number(doctor.breakDelayMins) || 0) : 0;
      const waitMins = Math.round(tokensAhead * effectiveMins + breakBuffer);

      const etaDate = new Date(Date.now() + waitMins * 60000);
      const etaString = etaDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      return { state: 'waiting', tokensAhead, waitMins, etaString };
    }

    // =========================================================
    // 3. URL & ROUTING HELPERS
    // =========================================================
    function getDoctorIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('doctor')) return params.get('doctor').trim().toLowerCase();

      const hash = window.location.hash || '';
      const match = hash.match(/#\/doctor\/([a-zA-Z0-9_-]+)/);
      if (match) return match[1].toLowerCase();

      return null;
    }

    function getDoctorShareUrl(doctorId) {
      const url = new URL(window.location.href);
      url.search = `?doctor=${encodeURIComponent(doctorId)}`;
      url.hash = '';
      return url.toString();
    }

    function navigateToDoctor(doctorId) {
      const url = new URL(window.location.href);
      url.search = `?doctor=${encodeURIComponent(doctorId)}`;
      url.hash = '';
      window.history.pushState({}, '', url);
      currentView = 'auto';
      lookupTokenNumber = '';
      render();
    }

    function navigateToRoot(e) {
      if (e) e.preventDefault();
      const url = new URL(window.location.href);
      url.search = '';
      url.hash = '';
      window.history.pushState({}, '', url);
      currentView = 'auto';
      lookupTokenNumber = '';
      render();
    }

    window.addEventListener('popstate', () => {
      currentView = 'auto';
      render();
    });

    // =========================================================
    // 4. UI UTILITIES
    // =========================================================
    let toastTimer = null;
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMessage');
      icon.textContent = isError ? '!' : '✓';
      icon.className = isError ? 'text-rose-400 font-bold' : 'text-teal-400 font-bold';
      msg.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2800);
    }

    function copyText(text, successMsg = 'Copied to clipboard!') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg)).catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(successMsg);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getQrImageUrl(dataUrl) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=${encodeURIComponent(dataUrl)}`;
    }

    // =========================================================
    // 5. NAVIGATION BAR RENDERER
    // =========================================================
    function renderNav() {
      const nav = document.getElementById('navRightControls');
      const session = getAuthSession();

      if (session) {
        const label = session.role === 'admin'
          ? 'Clinic Admin'
          : (appState.doctors.find(d => d.id === session.doctorId)?.name || 'Staff');

        nav.innerHTML = `
          <button onclick="openDashboard()" class="text-xs sm:text-sm font-semibold px-3 py-1.5 rounded-lg bg-teal-50 text-teal-700 border border-teal-200 hover:bg-teal-100 transition">
            ${escapeHtml(label)} Panel
          </button>
          <button onclick="handleLogout()" class="text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100 border border-slate-200 transition">
            Log Out
          </button>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="openLogin()" class="text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition shadow-sm">
            Staff / Admin Login
          </button>
        `;
      }
    }

    function openLogin() {
      currentView = 'login';
      render();
    }

    function openDashboard() {
      currentView = 'dashboard';
      render();
    }

    function handleLogout() {
      setAuthSession(null);
      currentView = 'auto';
      showToast('Logged out successfully');
      render();
    }

    // =========================================================
    // 6. VIEW A: PATIENT ISOLATED QUEUE VIEW (?doctor=<id>)
    // =========================================================
    function renderPatientDoctorView(doctor) {
      const avgInfo = getEffectiveAvgInfo(doctor);
      const statusBadges = {
        open: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot"></span> Clinic Open</span>`,
        break: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200"><span class="w-2 h-2 rounded-full bg-amber-500"></span> On Break (+${doctor.breakDelayMins || 0}m delay)</span>`,
        closed: `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Session Closed</span>`
      };

      const paceLabel = avgInfo.mode === 'live'
        ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-full border border-teal-200">⚡ Live Pace: ~${avgInfo.effectiveMins} min/patient (${avgInfo.patientsSeen} seen)</span>`
        : `<span class="inline-flex items-center gap-1 text-xs font-medium text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-full">⏱ Standard Pace: ~${avgInfo.effectiveMins} min/patient</span>`;

      let lookupHtml = '';
      if (lookupTokenNumber !== '' && !isNaN(Number(lookupTokenNumber)) && Number(lookupTokenNumber) > 0) {
        const tok = Number(lookupTokenNumber);
        const res = calculateWaitForToken(doctor, tok);
        if (res.state === 'passed') {
          lookupHtml = `
            <div class="mt-4 p-4 rounded-xl bg-slate-100 border border-slate-200 text-slate-700 text-sm">
              Token <strong>#${tok}</strong> has already passed (Currently serving <strong>#${doctor.currentToken}</strong>). Please check with the reception desk.
            </div>`;
        } else if (res.state === 'serving') {
          lookupHtml = `
            <div class="mt-4 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm font-medium">
              🎉 Token <strong>#${tok}</strong> is <strong>NOW BEING SERVED</strong>! Please proceed to <strong>${escapeHtml(doctor.room)}</strong>.
            </div>`;
        } else {
          lookupHtml = `
            <div class="mt-4 p-4 rounded-xl bg-teal-50 border border-teal-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <div class="text-xs font-semibold uppercase tracking-wider text-teal-700">Token #${tok} Estimate</div>
                <div class="text-lg font-bold text-slate-900">~${res.waitMins} mins wait <span class="text-sm font-normal text-slate-600">(${res.tokensAhead} ${res.tokensAhead === 1 ? 'patient' : 'patients'} ahead)</span></div>
              </div>
              <div class="sm:text-right">
                <div class="text-xs text-slate-500">Approx. Turn Time</div>
                <div class="text-base font-bold text-teal-700">${res.etaString}</div>
              </div>
            </div>`;
        }
      }

      const startTok = Math.max(1, doctor.currentToken);
      const endTok = Math.max(startTok, doctor.totalTokens);
      let rowsHtml = '';

      if (doctor.status === 'closed') {
        rowsHtml = `<tr><td colspan="4" class="px-4 py-8 text-center text-sm text-slate-500">This clinic session is currently closed.</td></tr>`;
      } else if (endTok < startTok) {
        rowsHtml = `<tr><td colspan="4" class="px-4 py-8 text-center text-sm text-slate-500">No active tokens in queue yet.</td></tr>`;
      } else {
        for (let t = startTok; t <= endTok; t++) {
          const calc = calculateWaitForToken(doctor, t);
          const isCurrent = t === doctor.currentToken;
          rowsHtml += `
            <tr class="${isCurrent ? 'bg-teal-50/70 font-semibold' : 'hover:bg-slate-50'} border-b border-slate-100 last:border-0">
              <td class="px-4 py-3 text-sm">
                <span class="inline-flex items-center justify-center w-9 h-7 rounded-lg ${isCurrent ? 'bg-teal-600 text-white font-bold' : 'bg-slate-100 text-slate-800 font-semibold'}">
                  #${t}
                </span>
              </td>
              <td class="px-4 py-3 text-sm">
                ${isCurrent
                  ? '<span class="text-teal-700 font-semibold">Now Serving</span>'
                  : `<span class="text-slate-600">${calc.tokensAhead} ahead</span>`}
              </td>
              <td class="px-4 py-3 text-sm text-slate-700">
                ${isCurrent ? '0 mins' : `~${calc.waitMins} mins`}
              </td>
              <td class="px-4 py-3 text-sm font-semibold text-right ${isCurrent ? 'text-teal-700' : 'text-slate-900'}">
                ${calc.etaString}
              </td>
            </tr>`;
        }
      }

      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <!-- Doctor Header Card -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <div class="text-xs font-semibold uppercase tracking-wider text-teal-600">${escapeHtml(doctor.room)}</div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 mt-0.5">${escapeHtml(doctor.name)}</h1>
                <p class="text-sm text-slate-500">${escapeHtml(doctor.specialty)}</p>
              </div>
              <div>${statusBadges[doctor.status] || statusBadges.open}</div>
            </div>

            <!-- Live Now Serving Box -->
            <div class="mt-6 bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl p-6 text-white flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="text-center sm:text-left">
                <div class="text-xs uppercase tracking-widest text-teal-300 font-semibold">Now Serving Token</div>
                <div class="text-5xl sm:text-6xl font-extrabold tracking-tight mt-1">
                  #${doctor.currentToken > 0 ? doctor.currentToken : '—'}
                </div>
                <div class="text-xs text-slate-300 mt-2">
                  Total Issued Today: <strong class="text-white">${doctor.totalTokens}</strong>
                </div>
              </div>
              <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 text-center sm:text-right border border-white/10 w-full sm:w-auto">
                <div class="text-xs text-slate-300">Consultation Pace</div>
                <div class="text-2xl font-bold text-teal-300 mt-0.5">~${avgInfo.effectiveMins} mins</div>
                <div class="text-[11px] text-slate-300 mt-1">
                  ${avgInfo.mode === 'live'
                    ? `Live avg (${avgInfo.patientsSeen} seen)`
                    : `Baseline (first ${WARMUP_PATIENT_COUNT} patients)`}
                </div>
              </div>
            </div>

            <!-- Check Your Token Calculator -->
            <div class="mt-6 pt-5 border-t border-slate-100">
              <label class="block text-sm font-semibold text-slate-800 mb-2">Check Your Token Wait Time</label>
              <div class="flex gap-2">
                <input
                  type="number"
                  min="1"
                  placeholder="Enter your token # (e.g. 12)"
                  value="${escapeHtml(lookupTokenNumber)}"
                  oninput="handleLookupInput(this.value)"
                  class="flex-1 rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500"
                />
                ${lookupTokenNumber ? `<button onclick="handleLookupInput('')" class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">Clear</button>` : ''}
              </div>
              ${lookupHtml}
            </div>
          </div>

          <!-- Upcoming Schedule Table -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
              <h2 class="font-bold text-slate-900 text-base">Live Queue Schedule</h2>
              ${paceLabel}
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold uppercase tracking-wider text-slate-500">
                    <th class="px-4 py-3">Token</th>
                    <th class="px-4 py-3">Queue Position</th>
                    <th class="px-4 py-3">Est. Wait</th>
                    <th class="px-4 py-3 text-right">Approx. Time</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function handleLookupInput(val) {
      lookupTokenNumber = val;
      render();
    }

    // =========================================================
    // 7. VIEW B: ROOT PORTAL
    // =========================================================
    function renderRootPortal() {
      const doctorCards = appState.doctors.map(doc => {
        const shareUrl = getDoctorShareUrl(doc.id);
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-col justify-between gap-4 shadow-sm hover:border-teal-300 transition">
            <div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-teal-600">${escapeHtml(doc.room)}</span>
                <span class="text-xs font-medium px-2 py-0.5 rounded-full ${doc.status === 'open' ? 'bg-emerald-50 text-emerald-700' : doc.status === 'break' ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-600'}">
                  ${doc.status === 'open' ? 'Open' : doc.status === 'break' ? 'On Break' : 'Closed'}
                </span>
              </div>
              <h3 class="font-bold text-slate-900 text-lg mt-1">${escapeHtml(doc.name)}</h3>
              <p class="text-xs text-slate-500">${escapeHtml(doc.specialty)}</p>
              <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
                <span>Now Serving: <strong class="text-slate-900">#${doc.currentToken}</strong></span>
                <span>Total: <strong class="text-slate-900">${doc.totalTokens}</strong></span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="navigateToDoctor('${escapeHtml(doc.id)}')" class="flex-1 bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition">
                Open Patient Link
              </button>
              <button onclick="copyText('${escapeHtml(shareUrl)}', 'Copied ${escapeHtml(doc.name)} URL!')" class="px-3 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-semibold text-slate-700" title="Copy Isolated URL">
                Copy URL
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 text-center shadow-sm">
            <div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center mx-auto text-2xl font-bold">
              🏥
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-3">Patient Queue Portal</h1>
            <p class="text-sm text-slate-600 max-w-md mx-auto mt-1.5">
              Each doctor has an isolated queue URL (<code class="text-xs bg-slate-100 px-1.5 py-0.5 rounded">?doctor=id</code>) so patients only view their own doctor's live token status.
            </p>
          </div>

          <div>
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500">Isolated Doctor Queue Links</h2>

    function fillLogin(user, pass) {

    function handleLoginSubmit(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (user === appState.admin.username && pass === appState.admin.password) {
        setAuthSession({ role: 'admin' });
        currentView = 'dashboard';
        showToast('Logged in as Clinic Admin');
        render();
        return;

      const doctor = appState.doctors.find(d => d.username === user && d.password === pass);
      if (doctor) {
        setAuthSession({ role: 'doctor', doctorId: doctor.id });
        currentView = 'dashboard';
        showToast(`Logged in for ${doctor.name}`);
        render();
        return;

      showToast('Invalid username or password', true);

    function advanceToken(doctorId, delta) {
      const doc = appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;

      const nextVal = Math.max(0, doc.currentToken + delta);
      if (doc.currentToken === 0 && nextVal >= 1 && !doc.sessionStartedAt) {
        doc.sessionStartedAt = Date.now();
        doc.totalPausedMs = 0;
      }
      doc.currentToken = nextVal;
      if (doc.currentToken > doc.totalTokens) {
        doc.totalTokens = doc.currentToken;
      }
      saveState(appState);
      showToast(`Now serving Token #${doc.currentToken}`);
      render();
    }

    function issueWalkInToken(doctorId) {
      const doc = appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.totalTokens += 1;
      saveState(appState);
      showToast(`Issued Token #${doc.totalTokens}`);
      render();
    }

    function setDoctorStatus(doctorId, newStatus) {
      const doc = appState.doctors.find(d => d.id === doctorId);
      if (!doc || doc.status === newStatus) return;

      if (newStatus === 'break') {
        doc.pausedAt = Date.now();
        if (!doc.breakDelayMins) doc.breakDelayMins = 15;
      } else if (doc.status === 'break' && doc.pausedAt) {
        doc.totalPausedMs = (doc.totalPausedMs || 0) + (Date.now() - doc.pausedAt);
        doc.pausedAt = null;
      }

      if (newStatus === 'open' && !doc.sessionStartedAt) {
        doc.sessionStartedAt = Date.now();
      }

      doc.status = newStatus;
      saveState(appState);
      showToast(`Status set to ${newStatus.toUpperCase()}`);
      render();
    }

    function updateDoctorSetting(doctorId, field, value) {
      const doc = appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc[field] = value;
      saveState(appState);
      showToast('Queue settings updated');
      render();
    }

    function simulateElapsedSession(doctorId, mins) {
      const doc = appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.sessionStartedAt = Date.now() - (mins * 60000);
      doc.totalPausedMs = 0;
      saveState(appState);
      showToast(`Simulated ${mins} mins elapsed session time`);
      render();
    }

    function resetDoctorQueue(doctorId) {
      const doc = appState.doctors.find(d => d.id === doctorId);
      if (!doc) return;
      doc.currentToken = 0;
      doc.totalTokens = 0;
      doc.sessionStartedAt = null;
      doc.pausedAt = null;
      doc.totalPausedMs = 0;
      doc.breakDelayMins = 0;
      doc.status = 'open';
      saveState(appState);
      showToast('Queue reset to #0 for new session');
      render();
    }

          <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">
            <h2 class="text-base font-bold text-slate-900 mb-3">Update Clinic Admin Credentials</h2>
            <form onsubmit="handleUpdateAdminCreds(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Admin Username</label>
                <input id="adminUserField" type="text" required value="${escapeHtml(appState.admin.username)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Admin Password</label>
                <input id="adminPassField" type="text" required value="${escapeHtml(appState.admin.password)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>
              <div>
                <button type="submit" class="w-full py-2 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold transition">
                  Update Admin Login
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function setEditingDoctor(id) {
      editingDoctorId = id;
      render();
    }

    function saveDoctorEdit(e, id) {
      e.preventDefault();
      const doc = appState.doctors.find(d => d.id === id);
      if (!doc) return;
      const fd = new FormData(e.target);
      doc.name = fd.get('name').trim();
      doc.specialty = fd.get('specialty').trim();
      doc.room = fd.get('room').trim();
      doc.username = fd.get('username').trim();
      doc.password = fd.get('password');
      doc.avgMins = Math.max(1, Number(fd.get('avgMins')));
      editingDoctorId = null;
      saveState(appState);
      showToast('Doctor details updated');
      render();
    }

    function handleAddDoctor(e) {
      e.preventDefault();
      const name = document.getElementById('newDocName').value.trim();
      const specialty = document.getElementById('newDocSpec').value.trim();
      const room = document.getElementById('newDocRoom').value.trim();
      const username = document.getElementById('newDocUser').value.trim().toLowerCase();
      const password = document.getElementById('newDocPass').value;
      const avgMins = Math.max(1, Number(document.getElementById('newDocAvg').value));

      if (appState.doctors.some(d => d.id === username || d.username === username)) {
        showToast('Username / URL slug already exists!', true);
        return;
      }

      appState.doctors.push({
        id: username,
        name,
        specialty,
        room,
        username,
        password,
        avgMins,
        currentToken: 0,
        totalTokens: 0,
        status: 'open',
        breakDelayMins: 0,
        sessionStartedAt: null,
        pausedAt: null,
        totalPausedMs: 0
      });

      saveState(appState);
      showToast(`Added ${name} (?doctor=${username})`);
      render();
    }

    function removeDoctor(id) {
      appState.doctors = appState.doctors.filter(d => d.id !== id);
      saveState(appState);
      showToast('Doctor removed');
      render();
    }

    function handleUpdateAdminCreds(e) {
      e.preventDefault();
      appState.admin.username = document.getElementById('adminUserField').value.trim();
      appState.admin.password = document.getElementById('adminPassField').value;
      saveState(appState);
      showToast('Admin credentials updated');
      render();
    }

    // =========================================================
    // 11. MAIN RENDER LOOP
    // =========================================================
    function render() {
      renderNav();
      const root = document.getElementById('appRoot');
      const session = getAuthSession();

      if (currentView === 'login') {
        root.innerHTML = renderLoginView();
        return;
      }

      if (currentView === 'dashboard' && session) {
        if (session.role === 'admin') {
          root.innerHTML = renderAdminDashboard();
        } else {
          const doc = appState.doctors.find(d => d.id === session.doctorId);
          root.innerHTML = renderDoctorControlPanel(doc);
        }
        return;
      }

      const urlDoctorId = getDoctorIdFromUrl();
      if (urlDoctorId) {
        const doctor = appState.doctors.find(d => d.id === urlDoctorId);
        if (doctor) {
          root.innerHTML = renderPatientDoctorView(doctor);
        } else {
          root.innerHTML = `
            <div class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 p-8 text-center">
              <h2 class="text-lg font-bold text-slate-900">Doctor Queue Not Found</h2>
              <p class="text-sm text-slate-500 mt-1">No active queue matches <code class="bg-slate-100 px-1.5 py-0.5 rounded">${escapeHtml(urlDoctorId)}</code>.</p>
              <button onclick="navigateToRoot()" class="mt-4 px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-semibold">Go to Clinic Portal</button>
            </div>`;
        }
        return;
      }

      if (session && currentView === 'auto') {
        currentView = 'dashboard';
        render();
        return;
      }

      root.innerHTML = renderRootPortal();
    }

    setInterval(() => {
      if (document.activeElement?.tagName !== 'INPUT') {
        render();
      }
    }, 30000);

    render();
  </script>
</body>
</html>
